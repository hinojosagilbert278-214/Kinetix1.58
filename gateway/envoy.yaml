# Sketch: Envoy picks the upstream cluster from x-kinetix-engine set by the ext_proc service.
static_resources:
  listeners:
  - name: ingress
    address: {socket_address: {address: 0.0.0.0, port_value: 8080}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service: {envoy_grpc: {cluster_name: kinetix_extproc}}
              processing_mode: {request_header_mode: SEND, request_body_mode: BUFFERED, response_header_mode: SKIP, response_body_mode: NONE}
          - name: envoy.filters.http.router
            typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
          route_config:
            virtual_hosts:
            - name: llm
              domains: ["*"]
              routes:
              - match: {prefix: "/", headers: [{name: x-kinetix-engine, string_match: {exact: cloud}}]}
                route: {cluster: cloud_vllm}
              - match: {prefix: "/"}
                route: {cluster: local_slm}
  clusters:
  - {name: kinetix_extproc, type: STRICT_DNS, typed_extension_protocol_options: {envoy.extensions.upstreams.http.v3.HttpProtocolOptions: {"@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions, explicit_http_config: {http2_protocol_options: {}}}}, load_assignment: {cluster_name: kinetix_extproc, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: gateway, port_value: 50051}}}}]}]}}
  - {name: local_slm, type: STRICT_DNS, load_assignment: {cluster_name: local_slm, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: local-slm, port_value: 8000}}}}]}]}}
  - {name: cloud_vllm, type: STRICT_DNS, load_assignment: {cluster_name: cloud_vllm, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: cloud-vllm, port_value: 8000}}}}]}]}}
